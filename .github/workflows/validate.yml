name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@2.1.327
      - run: claude plugin validate . --strict
      - run: evals/check-histories.sh
      - run: python3 evals/tools/check_plan_mocks.py
      - run: python3 evals/tools/make_plan_mocks.py && git diff --exit-code
      - run: ./build.sh
