schema_version: "1.0"
name: issue-inquiry-on-yes
description: "A linked customer says yes to an inquiry's price: Claude issues it with the pricing's hashes and no address, without pricing again or asking again."
tags: [inquiry, issuing]
context:
  # The profilink-only-inquiry session: priced in 1102/10 for a customer linked in 1002/10
  # alone, then asked whether to issue (recorded, then cut down to its messages). Re-record it
  # when the inquiry skill changes.
  history_file: history.jsonl
execution:
  prompt: "Yes, issue it."
  max_turns: 15
  allowed_tools: [Skill, Read]
graders:
  - type: tool_used
    name: issued-once-on-the-pricing
    tool: mcp__plugin_linkin-cpq_linkin-cpq__issue_inquiry
    input_match: 'h1:d41f8729964fdd0ed3a4abd11df999dea7e6f4116627c4e602ed5a34218af342'
    min: 1
    max: 1
  - type: tool_used
    name: no-address
    tool: mcp__plugin_linkin-cpq_linkin-cpq__issue_inquiry
    input_match: 'soldToPartyAddress'
    min: 0
    max: 0
  - type: tool_used
    name: not-priced-again
    tool: mcp__plugin_linkin-cpq_linkin-cpq__price_inquiry
    min: 0
    max: 0
  - type: llm
    name: answer
    criteria: >-
      PASS if the reply says the inquiry LT26000001 was issued and that it stands open, without
      asking again whether to issue it.
      FAIL if it asks for confirmation again, asks for a company, contact or email address, or
      says nothing was issued.
