schema_version: "1.0"
name: issue-as-prospect
description: "An account linked to no customer number says yes: Claude issues the inquiry as LINKIN's one-time customer with the pricing's hashes and no address, without pricing again, and doesn't call it unverified."
tags: [inquiry, issuing, customers]
context:
  # The unlinked-inquiry session: priced, then asked whether to issue (recorded, then cut down
  # to its messages). Re-record it when the inquiry skill changes.
  history_file: history.jsonl
execution:
  prompt: "Yes, issue it."
  max_turns: 15
  allowed_tools: [Skill, Read]
graders:
  - type: tool_used
    name: issued-once-on-the-pricing
    tool: mcp__plugin_linkin-cpq_linkin-cpq__issue_inquiry
    input_match: 'h1:7f8453aac8457535ef988d3edc8bbe2ef67be5192a7aa234830e7c1add7a1b4e'
    min: 1
    max: 1
  - type: tool_used
    name: no-address
    tool: mcp__plugin_linkin-cpq_linkin-cpq__issue_inquiry
    input_match: 'soldToPartyAddress'
    min: 0
    max: 0
  - type: tool_used
    name: not-priced-again
    tool: mcp__plugin_linkin-cpq_linkin-cpq__price_inquiry
    min: 0
    max: 0
  - type: llm
    name: answer
    criteria: >-
      PASS if the reply says the inquiry LI26000001 was issued and stands open as a preliminary
      offer.
      FAIL if it asks again whether to issue, asks for the buyer's company or contact details,
      says nothing was issued, says the inquiry or the account is unverified, or says what
      LINKIN's staff or sales desk see about it (a flag, a mark, a warning or a note).
  - type: llm
    name: no-copy
    criteria: >-
      PASS if the reply mentions no page, link or address for the document.
      FAIL if it gives an address, says a page was opened or saved, or offers a page or a link.
