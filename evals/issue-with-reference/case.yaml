schema_version: "1.0"
name: issue-with-reference
description: "The yes brings the reference: Claude prices again with it and, the price unchanged, issues on that yes without asking again."
tags: [quoting, issuing]
context:
  # A session that priced 120 bars and asked whether to issue (recorded on quote-a-price,
  # then cut down to its messages). Re-record it when the quoting skill changes.
  history_file: history.jsonl
execution:
  prompt: "Yes, issue it with our reference PO-4711."
  max_turns: 15
  allowed_tools: [Skill, Read]
graders:
  - type: tool_used
    name: repriced-with-reference
    tool: mcp__plugin_linkin-cpq_linkin-cpq__price_quotation
    input_match: '"customerReference"\s*:\s*"PO-4711"'
    min: 1
    max: 1
  - type: tool_used
    name: issued-once-on-the-new-pricing
    tool: mcp__plugin_linkin-cpq_linkin-cpq__issue_quotation
    input_match: 'h1:d6e7bc548c76237e2b6a0297f9603f89afd9c870e47b98e02d62ccda08281459'
    min: 1
    max: 1
  - type: tool_order
    name: priced-before-issuing
    before:
      tool: mcp__plugin_linkin-cpq_linkin-cpq__price_quotation
      input_match: 'PO-4711'
    after: mcp__plugin_linkin-cpq_linkin-cpq__issue_quotation
  - type: llm
    name: answer
    criteria: >-
      PASS if the reply says the quotation LT26000001 was issued with the reference PO-4711,
      without asking again whether to issue it.
      FAIL if it asks for confirmation again, or says nothing was issued.
